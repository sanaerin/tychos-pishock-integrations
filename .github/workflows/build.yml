name: Make exe with pyinstaller and package to zip, version from tag

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build executable
        run: python -m PyInstaller --clean "Tycho's PiShock Integrations.spec"

      - name: Create folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/package/Archives"
          Copy-Item "dist/Tycho's PiShock Integrations.exe" "dist/package/"
          Copy-Item "Archives/*" "dist/package/Archives/" -Recurse

      - name: zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/package/*" -DestinationPath "dist/TychosPiShockIntegrations.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TychosPiShockIntegrations
          path: dist/TychosPiShockIntegrations.zip

      - name: Github release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Tycho's PiShock Integrations ${{ github.ref_name }}
          files: dist/TychosPiShockIntegrations.zip